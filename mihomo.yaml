mixed-port: 7890
ipv6: true
allow-lan: true
unified-delay: true
tcp-concurrent: true

dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/15
  nameserver:
    - https://223.5.5.5/dns-query
    - 223.5.5.5
  fallback:
    - https://1.1.1.1/dns-query
    - 8.8.8.8
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
  nameserver-policy:
    "geosite:cn":
      - https://223.5.5.5/dns-query
      - 223.5.5.5
    "geosite:geolocation-!cn":
      - https://1.1.1.1/dns-query
      - 8.8.8.8

# 订阅提供者设置
proxy-providers:
  MySubscription:
    type: http
    url: "https://example.com/sub_link" # 替换为你的实际订阅链接
    interval: 86400
    path: ./provider/subscription.yaml
    health-check:
      enable: true
      interval: 600
      url: https://www.gstatic.com/generate_204

proxies: []

proxy-groups:
  - name: "节点选择"
    type: select
    use:
      - MySubscription
    proxies:
      - "自动选择"
      - "香港节点"
      - "台湾节点"
      - "日本节点"
      - "韩国节点"
      - "新加坡节点"
      - "美国节点"
      - "全球直连"

  - name: "香港节点"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    use:
      - MySubscription
    filter: "(?i)港|HK|Hong Kong"
    icon: "https://raw.githubusercontent.com/Lanlan13-14/Rules/main/icon/Hongkong.png"

  - name: "台湾节点"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    use:
      - MySubscription
    filter: "(?i)台|TW|Taiwan"
    icon: "https://raw.githubusercontent.com/Lanlan13-14/Rules/main/icon/Taiwan.png"

  - name: "日本节点"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    use:
      - MySubscription
    filter: "(?i)日|JP|Japan"
    icon: "https://raw.githubusercontent.com/Lanlan13-14/Rules/main/icon/Japan.png"

  - name: "韩国节点"
